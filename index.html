<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sippr | Welcome</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="mx-auto max-w-2xl">
    <main class="flex h-screen flex-col items-center justify-center gap-5">
      <h1 class="text-3xl font-semibold">Welcome to</h1>
      <img src="assets/logo.svg" alt="Sippr logo" width="190" height="74" />
      <img src="assets/juice_box.svg" width="95" height="154" />
      <div class="w-full px-8 py-5">
        <form
          class="font-default flex flex-col items-center text-center text-lg"
          action="profile/index.html"
        >
          <label for="email" class="mt-2 mb-1 text-xl">E-mail</label>
          <input
            type="text"
            id="email"
            required
            class="focus:border-brand-800 box-border rounded-lg border-2 border-solid border-gray-300 p-[8px] outline-0"
          />
          <label for="password" class="mt-2 mb-1 text-xl">Password</label>
          <input
            type="password"
            id="password"
            required
            minlength="8"
            class="focus:border-brand-800 box-border rounded-lg border-2 border-solid border-gray-300 p-[8px] outline-0"
          />
          <button
            type="submit"
            class="border-brand-500 active:bg-brand-500 hover:bg-brand-500 mt-6 border-2 border-solid bg-white p-[10px] text-4xl"
          >
            Sign in
          </button>
        </form>
      </div>
    </main>
  </body>
</html>
